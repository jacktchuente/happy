name: Publish Happy image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-happy-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          happy_commit="$(git -C app/happy rev-parse --short=12 HEAD)"
          image_name="${REGISTRY}/${IMAGE_NAME}"
          image_name="$(printf '%s' "${image_name}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "happy_commit=${happy_commit}"
            echo "image_name=${image_name}"
            echo "tags<<EOF"
            echo "${image_name}:${happy_commit}"
            echo "${image_name}:latest"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: app/happy
          file: app/happy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            engineering.happy.upstream-revision=${{ steps.meta.outputs.happy_commit }}
